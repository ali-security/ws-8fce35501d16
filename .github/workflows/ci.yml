name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha --grep pattern; empty runs the full suite'
        required: false
        default: ''

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - x86
        node:
          - 10
          - 12
          - 14
          - 16
          - 18
          - 20
          - 22
        os:
          - macOS-latest
          - ubuntu-latest
          - windows-latest
        exclude:
          - arch: x86
            os: macOS-latest
          - arch: x86
            os: ubuntu-latest
          - arch: x86
            node: 18
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
          cache: 'npm'
          cache-dependency-path: ./package.json
      - run: npm config set registry https://:2024-07-03T16%3A45%3A31.280000Z@time-machines-npm.sealsecurity.io/
        shell: bash
      - run: npm install
      - run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx nyc --reporter=lcov --reporter=text mocha --throw-deprecation --grep "${{ inputs.test-filter }}" test/*.test.js
          else
            npm test
          fi
        shell: bash
      - run: npm pack
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 22 && matrix.arch ==
          'x64'
      - uses: actions/upload-artifact@v4
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 22 && matrix.arch ==
          'x64'
        with:
          name: npm-tarball
          path: ws-*.tgz
          if-no-files-found: error
